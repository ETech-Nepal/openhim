server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  flyway:
    enabled: false
    baseline-on-migrate: true
    fail-on-missing-locations: false
  datasource:
    url: jdbc:postgresql://hapi-db:5432/hapi
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect

hapi:
  fhir:
    default_encoding: json
    narrative_enabled: false
    server_id_strategy: uuid
    # Allow client-assigned ids on PUT (e.g. PUT /Patient/{nepalHealthId}); the
    # default ALPHANUMERIC strategy rejects purely-numeric client ids.
    client_id_strategy: ANY

    # Load the Nepal NP Core IG (np.core 1.0.0) so the server knows the
    # fhir.digitalhealth.gov.np/core profiles, value sets and naming systems and can validate
    # resources against them. Tarball is mounted read-only by docker-compose.
    implementationguides:
      np_core:
        name: np.core
        version: 1.0.0
        packageUrl: file:/app/config/np.core-1.0.0.tgz

    # Validation stays OFF until the mediators emit np-core-conformant resources
    # (meta.profile + a mandatory nepal-health-id identifier). Flip on to enforce:
    # validation:
    #   requests_enabled: true
    #   responses_enabled: false

    # Patient identity/matching moves to JeMPI (external MPI).

    subscription:
      resthook_enabled: true

    tester:
      - id: home
        name: Local Tester
        server_address: 'http://fhir:8080/fhir'
        refuse_to_fetch_third_party_urls: false
        fhir_version: R4
