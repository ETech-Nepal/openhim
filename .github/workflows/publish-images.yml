name: Publish mediator images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    uses: ./.github/workflows/validate-mediators.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hapi-mediator
            context: services/fhir-mediator
          - image: fhir-intake-mediator
            context: services/fhir-intake-mediator
          - image: fhir-transform-mediator
            context: services/fhir-transform-mediator
          - image: openhie-admin-mediator
            context: service/admin-mediator
          - image: openhie-patient-portal-mediator
            context: service/patient-portal-mediator
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/etech-nepal/${{ matrix.image }}:${{ github.sha }}
