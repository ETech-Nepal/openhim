name: Publish mediator images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    uses: ./.github/workflows/validate-mediators.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openhie-hapi
            context: hapi-interceptors
          - image: openhie-identity-mediator
            context: services/identity-mediator
          - image: fhir-transform-mediator
            context: services/fhir-transform-mediator
          - image: openhie-patient-portal-mediator
            context: services/patient-portal-mediator
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/etech-nepal/${{ matrix.image }}:${{ github.sha }}
