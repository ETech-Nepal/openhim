name: Validate services

on:
  pull_request:
    paths:
      - "services/**"
      - "hapi-interceptors/**"
      - "docker-compose.yml"
      - ".github/workflows/**"
  push:
    paths:
      - "services/**"
      - "hapi-interceptors/**"
      - "docker-compose.yml"
      - ".github/workflows/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transform-mediator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fhir-transform-mediator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: services/fhir-transform-mediator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: docker build .

  identity-mediator:
    runs-on: ubuntu-latest
    # The repository tests (task lock, Health ID register) need a real PostgreSQL; they
    # fail rather than skip without one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: synthetic-identity
          POSTGRES_DB: identity
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U identity" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/identity-mediator
    env:
      TEST_IDENTITY_DB_PORT: "55439"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: services/identity-mediator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker build .

  hapi-interceptors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hapi-interceptors
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      # Unit tests, then every access rule against the real HAPI image.
      - run: mvn -B package
      - run: ./it/run.sh
      - run: docker build .
